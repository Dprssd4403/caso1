
<section class="tarjeta formulario-login">
  <h1>Iniciar sesión</h1>

  <p>Ingresa a tu cuenta CineMet</p>

  <form (ngSubmit)="ingresar()">
    <label for="email">Correo electrónico</label>

    <input
      id="email"
      type="email"
      name="email"
      [(ngModel)]="email"
      required
      placeholder="correo@cinemet.com"
    />

    <label for="password">Contraseña</label>

    <input
      id="password"
      type="password"
      name="password"
      [(ngModel)]="password"
      required
      placeholder="Contraseña"
    />

    @if (error) {
      <p class="mensaje-error">
        {{ error }}
      </p>
    }

    <button
      type="submit"
      class="btn"
      [disabled]="cargando">
      {{ cargando ? 'Ingresando...' : 'Ingresar' }}
    </button>
  </form>
</section>
